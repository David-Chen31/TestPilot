services:
  app:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_MIRROR: ${PIP_MIRROR:-}
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    # 双保险：不产生普通的 core 文件（WSL 管道式收集由镜像里的 no_core_dump.pth 处理）
    ulimits:
      core: 0
    # 内存上限（含页缓存）：不加限制时，评测反复复制工作区、mutmut 生成变异体留下的页缓存会让
    # WSL 虚拟机一直向 Windows 要内存，Windows 随之扩大 C 盘的 pagefile.sys（M5.5 中 C 盘因此少了约 7 GB）。
    # 实测最重的一次评测（约 900 个测试的变异测试）峰值 2.0 GB；M8 并发 4 个运行，留到 8 GB。
    mem_limit: 8g
    memswap_limit: 8g
    volumes:
      # 代码以可编辑方式安装，挂载后改代码不用重建镜像（依赖变化时才需要 build）。
      # 只读：被测代码和生成的测试以子进程在同一容器里运行，不能让它们改写评测器本身
      - ./testpilot:/app/testpilot:ro
      - ./tests:/app/tests:ro
      # 评测仓库与实验结果落在宿主机
      - ./data:/app/data
      - ./results:/app/results

  redis:
    image: redis:7-alpine
