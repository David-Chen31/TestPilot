services:
  app:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_MIRROR: ${PIP_MIRROR:-}
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      # 代码以可编辑方式安装，挂载后改代码不用重建镜像（依赖变化时才需要 build）。
      # 只读：被测代码和生成的测试以子进程在同一容器里运行，不能让它们改写评测器本身
      - ./testpilot:/app/testpilot:ro
      - ./tests:/app/tests:ro
      # 评测仓库与实验结果落在宿主机
      - ./data:/app/data
      - ./results:/app/results

  redis:
    image: redis:7-alpine
