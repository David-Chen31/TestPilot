commit = "4e5faa3d7e4008d89e0d8bf1ea87b6d9a061a16d"  # 2026-09-23
group = "old"
python_paths = ["."]
tests = "tests"
remove = ["tests", "misc", "docs"]
targets = ["boltons/cacheutils.py", "boltons/dictutils.py", "boltons/excutils.py", "boltons/fileutils.py", "boltons/formatutils.py", "boltons/funcutils.py", "boltons/ioutils.py", "boltons/jsonutils.py", "boltons/listutils.py", "boltons/mathutils.py", "boltons/namedutils.py", "boltons/pathutils.py", "boltons/queueutils.py", "boltons/setutils.py", "boltons/statsutils.py", "boltons/tableutils.py", "boltons/timeutils.py", "boltons/typeutils.py"]

