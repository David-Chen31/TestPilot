# 评测仓库清单。每个仓库固定 commit；remove 列出的路径（自带测试等）在工作副本中删除，
# 避免 Agent 读到并照抄已有测试——我们只评测生成的测试。

[toolz]
url = "https://github.com/pytoolz/toolz.git"
commit = "451af60dec590a6010e2babdbf391ea8f815122f"  # 2026-09-18
python_paths = ["."]
tests = "toolz/tests"
remove = ["toolz/tests", "toolz/sandbox/tests", "bench"]
group = "old"
targets = ["toolz/dicttoolz.py", "toolz/itertoolz.py", "toolz/functoolz.py"]

# ---- M8 ----
# group：old = 2026-05 之前就存在的流行库（可能出现在模型训练数据里，包括它们自带的测试）；
#        new = 2026-06 之后才创建的仓库（作为数据污染对照）。DeepSeek 没有公布训练截止日期，这个划分是近似。
# tests：仓库自带测试的位置（评测时删除；预检时保留，用来得到“开发者手写测试”的参照得分）。
# 目标筛选规则（docs/design.md §7.1）：60–1200 行，至少一个公开函数 / 类；排除只做重导出的 __init__、
# 命令行入口、兼容层、常量表、只有异常定义的文件，以及依赖操作系统 / 外部环境的模块
# （socket、gc、traceback、调试器、trio 等）。

[boltons]
