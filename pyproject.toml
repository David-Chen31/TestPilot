[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot"
version = "0.1.0"
description = "面向 Python 代码仓库的单元测试生成 Agent（Agent 循环 + 变异测试反馈）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # 沙箱用它们执行被测仓库的测试，所以是运行时依赖而不是开发依赖
    "pytest>=8.0",
    "coverage>=7.4",
    "pytest-timeout>=2.3",
    # 变异测试依赖 fork，不支持原生 Windows；版本锁死是因为结果导出用到了它的内部 API
    "mutmut==3.8.0; sys_platform != 'win32'",
    # 工具协议。langchain-mcp-adapters 目前要求 mcp 1.x
    "mcp>=1.30,<2",
    # LLM：OpenAI 兼容接口（DeepSeek）
    "langchain-openai>=1.7",
    "python-dotenv>=1.0",
    # Agent 编排与 MCP 接入
    "langgraph>=1.2",
    "langchain-mcp-adapters>=0.3.2",
    # 服务
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.setuptools.packages.find]
include = ["testpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# fixtures 下是“被测仓库”样例，里面的测试只在沙箱里跑，不属于 TestPilot 自身的测试
norecursedirs = ["fixtures"]
